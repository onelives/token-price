name: daily-update

on:
  schedule:
    - cron: '17 1 * * *'   # 每天 09:17 北京时间（UTC+8）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖（jsdom，仅测试用）
        run: npm install

      - name: 抓取官方价格
        run: node scripts/fetch.mjs

      - name: 生成对比页
        run: node scripts/build.mjs

      - name: 端到端测试
        run: node scripts/test.js

      - name: 提交并推送（仅当有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --quiet --cached; then
            echo "价格无变化，跳过提交"
          else
            git commit -m "chore: 价格更新 $(date +%F)"
            git push
          fi
